name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:

env:
  EXTNAME: PageComments

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.1', '8.3' ]
        mediawiki: [ REL1_43 ]
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
      - name: Run MediaWiki PHPUnit
        uses: wikiteq/mediawiki-phpunit-action@master
        with:
          type: extension
          php: ${{ matrix.php }}
          mwbranch: ${{ matrix.mediawiki }}
          extension: ${{ env.EXTNAME }}

  style:
    name: Composer checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout extension
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl
          coverage: none
          tools: composer
      - name: Install dependencies
        run: composer install --no-interaction --no-progress
      - name: Run extension checks
        run: composer test

  phan:
    name: Phan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mediawiki: [ REL1_43 ]
    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, intl, ast
          coverage: none
          tools: composer
      - name: Checkout MediaWiki core
        uses: actions/checkout@v4
        with:
          repository: wikimedia/mediawiki
          ref: ${{ matrix.mediawiki }}
          path: mediawiki
      - name: Checkout extension
        uses: actions/checkout@v4
        with:
          path: mediawiki/extensions/${{ env.EXTNAME }}
      - name: Install MediaWiki + extension dependencies
        working-directory: mediawiki
        run: |
          echo '{"extra":{"merge-plugin":{"include":["extensions/*/composer.json","skins/*/composer.json"]}}}' > composer.local.json
          composer update --no-interaction --no-progress
      - name: Run phan
        working-directory: mediawiki
        run: ./vendor/bin/phan -d extensions/${{ env.EXTNAME }} --minimum-target-php-version=8.1 --long-progress-bar
